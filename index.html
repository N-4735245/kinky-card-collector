<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N's Reverie | Kinky Card Collector</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link rel="stylesheet" href="style.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js"
    integrity="sha256-KzZiKy0DWYsnwMF+X1DvQngQ2/FxF7MF3Ff72XcpuPs=" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #212529;
      --muted: #6c757d;
      --card-bg: #ffffff;
      --card-border: #ddd;
      --card-shadow: rgba(0, 0, 0, .08);
      --tab-border: #dee2e6;
    }

    [data-theme="dark"] {
      --bg: #16181c;
      --text: #e8e6e3;
      --muted: #9aa0a6;
      --card-bg: #202226;
      --card-border: #3a3d42;
      --card-shadow: rgba(255, 255, 255, .18);
      --tab-border: #3a3d42;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16181c;
        --text: #e8e6e3;
        --muted: #9aa0a6;
        --card-bg: #202226;
        --card-border: #3a3d42;
        --card-shadow: rgba(255, 255, 255, .18);
        --tab-border: #3a3d42;
      }
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color .2s ease, color .2s ease;
      font-family: 'EB Garamond', Georgia, serif;
    }

    .page-title,
    .deck h2 {
      font-family: 'Permanent Marker', cursive;
    }

    .deck-tabs .nav-link {
      font-family: 'EB Garamond', Georgia, serif;
    }

    .lead {
      color: var(--muted);
    }

    .deck-tabs {
      border-bottom-color: var(--tab-border);
    }

    .deck-tabs .nav-link {
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
    }

    .deck-tabs .nav-link[data-deck="starter"].active { border-top: 3px solid #6d3fb5; color: #6d3fb5; }
    .deck-tabs .nav-link[data-deck="main"].active { border-top: 3px solid #1f6fd6; color: #1f6fd6; }
    .deck-tabs .nav-link[data-deck="ending"].active { border-top: 3px solid #d6249f; color: #d6249f; }

    .active-card {
      padding: 0 !important;
      height: auto !important;
      width: auto !important;
      max-width: 100% !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      background-color: transparent !important;
      margin: 0 auto 20px auto !important;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .active-card-img {
      max-width: 100% !important;
      max-height: 480px !important;
      height: auto !important;
      width: auto !important;
      display: block;
      filter: drop-shadow(0 10px 22px var(--card-shadow));
    }

    .btn-deck-starter { background-color: #6d3fb5; border-color: #6d3fb5; color: #fff; }
    .btn-deck-starter:hover, .btn-deck-starter:focus { background-color: #5c349c; border-color: #5c349c; color: #fff; }

    .btn-deck-main { background-color: #1f6fd6; border-color: #1f6fd6; color: #fff; }
    .btn-deck-main:hover, .btn-deck-main:focus { background-color: #1a5cb3; border-color: #1a5cb3; color: #fff; }

    .btn-deck-ending { background-color: #d6249f; border-color: #d6249f; color: #fff; }
    .btn-deck-ending:hover, .btn-deck-ending:focus { background-color: #b31f85; border-color: #b31f85; color: #fff; }

    .solo-toggle-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 20px;
      padding: 6px 18px;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.5rem;
      cursor: pointer;
      margin: 32px 0;
      display: inline-block;
    }

    .deck-body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .solo-tracker-panel {
      max-width: 260px;
      margin: 0;
      margin-left: -18rem;
      padding: 18px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background-color: var(--card-bg);
      position: sticky;
      top: 1.5rem;
      z-index: 5;
    }

    .solo-tracker-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .solo-tracker-row input {
      width: 64px;
      text-align: center;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background-color: var(--bg);
      color: var(--text);
    }

    .solo-tracker-target {
      text-align: center;
      color: var(--muted);
      margin-bottom: 14px;
      font-size: 0.9rem;
    }

    .solo-tracker-counters {
      display: flex;
      justify-content: space-around;
      gap: 16px;
      margin-bottom: 12px;
    }

    .solo-counter {
      text-align: center;
    }

    .solo-counter-value {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 4px 0;
    }

    .solo-counter button {
      border: 1px solid var(--card-border);
      background-color: var(--bg);
      color: var(--text);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      cursor: pointer;
    }

    .solo-status {
      text-align: center;
      font-weight: 600;
      min-height: 22px;
      margin-bottom: 8px;
    }

    .solo-reset-btn {
      display: block;
      margin: 0 auto;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 14px;
      cursor: pointer;
    }

    .theme-toggle-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    @media (min-width: 992px) {
      .deck-tabs .nav-link {
        font-size: 1.35rem !important;
        padding: 0.9rem 1.75rem !important;
      }

      .active-card-img {
        max-height: 640px !important;
      }

      .deck-pane .btn-lg {
        font-size: 1.35rem !important;
        padding: 0.85rem 2.25rem !important;
      }
    }
  </style>
</head>

<body>

  <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme();" aria-label="Toggle dark mode" title="Toggle dark mode">
    <i class="fas fa-moon"></i>
  </button>

  <div class="container">
    <div class="text-center"><br/>
      <div class="display-4 page-title">Kinky Card Collector</div>
      <p class="lead">Draw your cards here and play against yourself (or a partner) &lt;3</p><br/><br/>
    </div>

    <ul class="nav nav-tabs deck-tabs justify-content-center" id="deckTabs" role="tablist">
      <li class="nav-item">
        <a class="nav-link active" data-deck="starter" onclick="switchDeck('starter');">Starter</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-deck="main" onclick="switchDeck('main');">Main</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-deck="ending" onclick="switchDeck('ending');">Ending</a>
      </li>
    </ul>

    <div class="text-center">
      <button id="solo-tracker-toggle" class="solo-toggle-btn" onclick="toggleSoloTracker();">Solo tracker</button>
    </div>

    <div id="solo-tracker-panel" class="solo-tracker-panel d-none">
      <div class="solo-tracker-row">
        <label for="clothing-count">Clothing items worn</label>
        <input type="number" id="clothing-count" min="0" value="0" oninput="updateSoloTarget();">
      </div>
      <div class="solo-tracker-target">Target: <span id="solo-target">0</span> points</div>
      <div class="solo-tracker-counters">
        <div class="solo-counter">
          <div>Points</div>
          <div class="solo-counter-value" id="solo-points">0</div>
          <button onclick="adjustSolo('points', 1);" aria-label="Add a point">+</button>
          <button onclick="adjustSolo('points', -1);" aria-label="Remove a point">&minus;</button>
        </div>
        <div class="solo-counter">
          <div>Fails</div>
          <div class="solo-counter-value" id="solo-fails">0</div>
          <button onclick="adjustSolo('fails', 1);" aria-label="Add a fail">+</button>
          <button onclick="adjustSolo('fails', -1);" aria-label="Remove a fail">&minus;</button>
        </div>
      </div>
      <div id="solo-status" class="solo-status"></div>
      <button class="solo-reset-btn" onclick="resetSolo();">Reset session</button>
    </div>

    <div class="deck-pane" data-deck="starter">
      <div class="deck">
        <h2 class="mt-4">Starter deck</h2><br/>
        <div class="deck-body">
          <div class="active-card">
            <p id="card-placeholder-starter" class="active-card-text">Click draw to begin.</p>
            <img id="card-img-starter" class="active-card-img d-none" alt="Starter card">
          </div>
        </div><br/>
        <p><button class="btn btn-lg btn-deck-starter" onclick="drawCard('starter');">Draw</button></p><br/>
      </div>
    </div>

    <div class="deck-pane d-none" data-deck="main">
      <div class="deck">
        <h2 class="mt-4">Main deck</h2><br/>
        <div class="deck-body">
          <div class="active-card">
            <p id="card-placeholder-main" class="active-card-text">Click draw to begin.</p>
            <img id="card-img-main" class="active-card-img d-none" alt="Main card">
          </div>
        </div><br/>
        <p><button class="btn btn-lg btn-deck-main" onclick="drawCard('main');">Draw</button></p><br/>
      </div>
    </div>

    <div class="deck-pane d-none" data-deck="ending">
      <div class="deck">
        <h2 class="mt-4">Ending deck</h2><br/>
        <div class="deck-body">
          <div class="active-card">
            <p id="card-placeholder-ending" class="active-card-text">Click draw to begin.</p>
            <img id="card-img-ending" class="active-card-img d-none" alt="Ending card">
          </div>
        </div><br/>
        <p><button class="btn btn-lg btn-deck-ending" onclick="drawCard('ending');">Draw</button></p><br/>
      </div>
    </div>

  </div>


  <script>
    // Image-based cards, loaded from the /cards folder in this repo.
    // Filenames must exactly match "<Label> Card - <number>.png" (case-sensitive on GitHub Pages).
    // To add cards: bump the count below and upload the matching numbered file — numbering
    // must stay sequential from 1 with no gaps, since the count is all this reads from.
    const DeckLabels = {
      starter: 'Starter',
      main: 'Main',
      ending: 'Ending'
    };

    const CardCounts = {
      starter: 1,
      main: 1,
      ending: 1
    };

    function buildCardList(deckName) {
      let label = DeckLabels[deckName];
      let list = [];
      for (let i = 1; i <= CardCounts[deckName]; i++) {
        list.push('cards/' + label + ' Card - ' + i + '.png');
      }
      return list;
    }

    const CardLists = {
      starter: buildCardList('starter'),
      main: buildCardList('main'),
      ending: buildCardList('ending')
    };

    let Decks = { starter: [], main: [], ending: [] };

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function refillCards(deckName) {
      Decks[deckName] = shuffle(CardLists[deckName].slice());
      console.log('INFO: ' + deckName + ' deck refilled and shuffled.');
    }

    function drawCard(deckName) {
      if (Decks[deckName].length < 1) {
        refillCards(deckName);
      }
      let cardPath = Decks[deckName].pop();
      let img = document.getElementById('card-img-' + deckName);
      let placeholder = document.getElementById('card-placeholder-' + deckName);

      img.onerror = function () {
        placeholder.textContent = 'Couldn\u2019t load "' + cardPath + '" \u2014 check the file was uploaded with that exact name.';
        placeholder.classList.remove('d-none');
        img.classList.add('d-none');
      };

      img.onload = function () {
        placeholder.classList.add('d-none');
        img.classList.remove('d-none');
      };

      img.src = encodeURI(cardPath);
    }

    function switchDeck(deckName) {
      document.querySelectorAll('.deck-tabs .nav-link').forEach(function (tab) {
        tab.classList.toggle('active', tab.getAttribute('data-deck') === deckName);
      });

      document.querySelectorAll('.deck-pane').forEach(function (pane) {
        pane.classList.toggle('d-none', pane.getAttribute('data-deck') !== deckName);
      });

      placeSoloTracker();
    }

    // Each deck shuffles independently on load, so switching tabs never resets the others.
    Object.keys(CardLists).forEach(refillCards);

    // SOLO TRACKER
    let soloState = { clothing: 0, points: 0, fails: 0 };

    function loadSolo() {
      try {
        let saved = localStorage.getItem('solo-tracker-state');
        if (saved) soloState = JSON.parse(saved);
      } catch (e) {
        soloState = { clothing: 0, points: 0, fails: 0 };
      }
    }

    function saveSolo() {
      try {
        localStorage.setItem('solo-tracker-state', JSON.stringify(soloState));
      } catch (e) {
        console.log('INFO: could not persist solo tracker state.');
      }
    }

    function renderSolo() {
      document.getElementById('clothing-count').value = soloState.clothing;
      let target = soloState.clothing * 3;
      document.getElementById('solo-target').textContent = target;
      document.getElementById('solo-points').textContent = soloState.points;
      document.getElementById('solo-fails').textContent = soloState.fails;

      let status = document.getElementById('solo-status');
      if (target > 0 && soloState.points >= target) {
        status.textContent = 'Target reached \u2014 you win!';
        status.style.color = '#1f9d55';
      } else if (target > 0 && soloState.fails > target) {
        status.textContent = 'Too many fails \u2014 game over.';
        status.style.color = '#d6249f';
      } else {
        status.textContent = '';
      }
    }

    function updateSoloTarget() {
      let val = parseInt(document.getElementById('clothing-count').value, 10);
      soloState.clothing = isNaN(val) ? 0 : Math.max(0, val);
      saveSolo();
      renderSolo();
    }

    function adjustSolo(field, delta) {
      soloState[field] = Math.max(0, (soloState[field] || 0) + delta);
      saveSolo();
      renderSolo();
    }

    function resetSolo() {
      soloState = { clothing: soloState.clothing, points: 0, fails: 0 };
      saveSolo();
      renderSolo();
    }

    function toggleSoloTracker() {
      document.getElementById('solo-tracker-panel').classList.toggle('d-none');
    }

    function placeSoloTracker() {
      var visiblePane = document.querySelector('.deck-pane:not(.d-none)');
      var tracker = document.getElementById('solo-tracker-panel');
      if (visiblePane && tracker) {
        var body = visiblePane.querySelector('.deck-body');
        if (body) {
          body.appendChild(tracker);
        }
      }
    }

    loadSolo();
    renderSolo();
    placeSoloTracker();

    // THEME
    function updateToggleIcon(theme) {
      let icon = document.querySelector('#theme-toggle i');
      if (icon) {
        icon.classList.toggle('fa-moon', theme !== 'dark');
        icon.classList.toggle('fa-sun', theme === 'dark');
      }
    }

    function toggleTheme() {
      let systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let current = document.documentElement.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
      let next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      updateToggleIcon(next);
      try {
        localStorage.setItem('virtudeck-theme', next);
      } catch (e) {
        console.log('INFO: could not persist theme preference.');
      }
    }

    (function initTheme() {
      let stored = null;
      try {
        stored = localStorage.getItem('virtudeck-theme');
      } catch (e) {
        stored = null;
      }

      if (stored) {
        document.documentElement.setAttribute('data-theme', stored);
        updateToggleIcon(stored);
      } else {
        updateToggleIcon(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
    })();
  </script>
</body>

</html>
